<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المعلمة</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#edf3f8;color:#193c54}header{background:#164369;color:white;padding:22px;text-align:center}main{max-width:1100px;margin:auto;padding:16px}.card{background:white;padding:20px;border-radius:14px;margin:14px 0;box-shadow:0 2px 10px #15354b12}input,button,select{font:inherit;padding:11px;border-radius:8px;border:1px solid #b4c7d5}button{background:#126c91;color:white;cursor:pointer;border:0}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;text-align:right}td,th{padding:10px;border-bottom:1px solid #ddd}th{background:#edf3f8}.scroll{overflow:auto}.muted{color:#567}.error{color:#ae2929}textarea{width:100%;min-height:80px}a{color:#126c91}</style></head><body><header><h1>لوحة المعلمة</h1><div>Your English Teacher: Amnah Al-Shareef</div></header><main><section id="login" class="card"><h2>تسجيل دخول المعلمة</h2><p>هذا الرابط مخصص للحساب المصرح له فقط.</p><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="signin">دخول</button><p id="loginstatus" role="status"></p></section><section id="dashboard" hidden><div class="card"><button id="logout">خروج</button><h2>نتائج الطالبات</h2><label>الفصل <select id="filter"><option value="">جميع الفصول</option><option>ثاني عام 4</option><option>ثاني عام 5</option></select></label> <button id="export">تصدير CSV</button><p id="count"></p><p class="muted">الدرجة آلية للأسئلة الموضوعية من 48. لا تعرض هذه الصفحة للطالبات.</p></div><div class="card scroll"><table><thead><tr><th>اسم الطالبة</th><th>الفصل</th><th>الدرجة</th><th>التاريخ</th></tr></thead><tbody id="rows"></tbody></table></div><div class="card" id="detail" hidden><h3>تفاصيل الإجابات</h3><pre id="writing" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></div></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,getDocs} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const firebaseConfig = {apiKey:"AIzaSyCwjmfkdydDRGauA5oZ53IJu2lXTBKR5VY",authDomain:"mg2-unit4-interactive.firebaseapp.com",projectId:"mg2-unit4-interactive",storageBucket:"mg2-unit4-interactive.firebasestorage.app",messagingSenderId:"570183792813",appId:"1:570183792813:web:1bd550e01c535aac8c2e24"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let data=[];const $=id=>document.getElementById(id);const isAdmin=false;const role='المعلمة';
$('signin').onclick=async()=>{try{$('loginstatus').textContent='جار تسجيل الدخول...';await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginstatus').textContent='تعذر الدخول: '+e.code}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{data=[];$('dashboard').hidden=true;$('login').hidden=!!u;if(!u)return;try{const snap=await getDocs(collection(db,'submissions'));data=snap.docs.map(d=>({id:d.id,...d.data()}));$('dashboard').hidden=false;render()}catch(e){$('login').hidden=false;$('loginstatus').textContent='لا توجد صلاحية لعرض النتائج أو حدث خطأ: '+e.code;await signOut(auth)}});
function render(){const f=$('filter').value;const filtered=data.filter(x=>!f||x.cls===f).sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('count').textContent=`عدد التسليمات: ${filtered.length}`;const tbody=$('rows');tbody.replaceChildren();for(const x of filtered){const tr=document.createElement('tr');for(const val of [x.student||'',x.cls||'',`${x.score??'-'} / ${x.total??48}`,x.date?new Date(x.date).toLocaleString('ar-SA'):'']){const td=document.createElement('td');td.textContent=val;tr.append(td)}const td=document.createElement('td'),b=document.createElement('button');b.textContent='عرض';b.onclick=()=>{$('detail').hidden=false;$('writing').textContent=Object.entries(x.writing||{}).map(([k,v])=>k+': '+v).join('\n\n')||'لا توجد كتابة';};td.append(b);tr.append(td);tbody.append(tr)}}
$('filter').onchange=render;
$('export').onclick=()=>{const f=$('filter').value;const rows=[['Student','Class','Score','Total','Date'],...data.filter(x=>!f||x.cls===f).map(x=>[x.student,x.cls,x.score,x.total,x.date])];const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='unit4-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
